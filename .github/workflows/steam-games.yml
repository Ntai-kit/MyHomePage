# Steam から遊んだゲームの一覧を毎日取り、data/steam-games.json が変わっていればコミットする
name: Steam のゲーム一覧を更新

on:
  schedule:
    # 毎日 日本時間の 4:00（UTC の 19:00）
    - cron: '0 19 * * *'
  # Actions の画面から手で動かせるようにする
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 作者がタグを付け替えても知らないコードが動かないよう、コミットの SHA で固定する（書き込みの権限があるため）。
      # 上げるときは、新しいタグの SHA を git ls-remote --tags https://github.com/actions/checkout などで調べる
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # その時点でサポート中の LTS の、いちばん新しい版を使う（24 から 26 のような大きな版の切り替えも自動）。
          # 実行環境に置いてある少し古い版ではなく、毎回最新を取ってくる。
          # スクリプトは Node の標準の機能しか使わないので、版が上がっても動きは変わらない想定
          node-version: lts/*
          check-latest: true

      - name: Steam から一覧を取る
        run: node scripts/fetch-steam-games.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: '76561199681275619'

      - name: 変わっていればコミットする
        run: |
          # 取った日時は毎回変わるので、ゲームの中身が変わったときだけコミットする
          if git diff --quiet -- data/steam-games.json; then
            echo '変更なし'
            exit 0
          fi
          if git show HEAD:data/steam-games.json > /tmp/before.json 2>/dev/null \
            && [ "$(jq -c .games /tmp/before.json)" = "$(jq -c .games data/steam-games.json)" ]; then
            echo 'ゲームの中身は変わっていない'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/steam-games.json
          git commit -m 'Steam のゲーム一覧を更新'
          git push
